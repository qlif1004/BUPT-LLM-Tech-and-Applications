<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Tracker Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--sidebar-w:240px;--bg:#f8f9fa;--surface:#fff;--text:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--accent-hover:#1d4ed8;--danger:#dc2626;--danger-hover:#b91c1c;--shadow:0 1px 3px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:#1e293b;color:#e2e8f0;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:20px 16px;border-bottom:1px solid #334155}
.sidebar-header h1{font-size:15px;font-weight:700;letter-spacing:-.01em}
.sidebar-header p{font-size:11px;color:#94a3b8;margin-top:4px}
.nav{flex:1;padding:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:#94a3b8;transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:#334155;color:#e2e8f0}
.nav-item.active{background:#2563eb;color:#fff}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.page{display:none;flex:1;flex-direction:column;overflow:hidden}
.page.active{display:flex}
.chat-messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.chat-msg{max-width:85%;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6;word-break:break-word}
.chat-msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.chat-msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.chat-msg.bot h1,.chat-msg.bot h2{font-size:15px;margin:8px 0 4px}
.chat-msg.bot h3{font-size:14px;margin:6px 0 3px}
.chat-msg.bot p{margin:4px 0}
.chat-msg.bot ul,.chat-msg.bot ol{padding-left:18px;margin:4px 0}
.chat-msg.bot code{background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:13px}
.chat-msg.bot pre{background:#1e293b;color:#e2e8f0;padding:12px;border-radius:6px;overflow-x:auto;margin:8px 0;font-size:12px}
.chat-loading{align-self:flex-start;display:flex;gap:4px;padding:12px 16px}
.chat-loading span{width:8px;height:8px;background:#94a3b8;border-radius:50%;animation:bounce 1.4s infinite}
.chat-loading span:nth-child(2){animation-delay:.2s}
.chat-loading span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6)}40%{transform:scale(1)}}
.chat-input-wrap{padding:16px 24px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:10px}
.chat-input-wrap textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;line-height:1.5;outline:none;max-height:120px}
.chat-input-wrap textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.chat-input-wrap button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.chat-input-wrap button:hover{background:var(--accent-hover)}
.chat-input-wrap button:disabled{opacity:.5;cursor:not-allowed}
.reports-list{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.report-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.report-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.report-card h3{font-size:14px;font-weight:600;margin-bottom:4px}
.report-card .meta{font-size:12px;color:var(--muted)}
.report-card .preview{font-size:13px;color:var(--muted);margin-top:4px}
.report-card .card-actions{display:flex;justify-content:flex-end;margin-top:8px;gap:8px}
.report-card .card-actions button{padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .15s}
.report-card .card-actions button:hover{background:#fef2f2;color:var(--danger);border-color:var(--danger)}
.report-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:14px;width:min(900px,95vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px}
.modal-close:hover{background:#f1f5f9;color:var(--text)}
.modal-body{flex:1;overflow-y:auto;padding:20px 24px;font-size:14px;line-height:1.8}
.modal-body h1{font-size:20px;margin-bottom:12px}
.modal-body h2{font-size:16px;margin:20px 0 8px;border-bottom:1px solid var(--border);padding-bottom:4px}
.modal-body h3{font-size:14px;margin:12px 0 6px}
.modal-body code{background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:13px}
.tasks-container{flex:1;overflow-y:auto;padding:20px 24px}
.tasks-container table{width:100%;border-collapse:collapse;font-size:14px}
.tasks-container th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tasks-container td{padding:12px;border-bottom:1px solid var(--border)}
.tasks-container tr:hover td{background:#f8fafc}
.task-schedule{display:inline-block;background:#f1f5f9;padding:2px 8px;border-radius:4px;font-size:12px;font-family:monospace}
.btn-del-task{background:var(--danger);color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;transition:background .15s}
.btn-del-task:hover{background:var(--danger-hover)}
.task-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.page-header{padding:20px 24px 0;font-size:15px;font-weight:600;flex-shrink:0}
@media(max-width:640px){.sidebar{width:60px}.sidebar-header h1,.sidebar-header p,.nav-item span{display:none}.nav-item{justify-content:center;padding:10px}}
</style>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-header"><h1>Academic Tracker</h1><p>论文追踪助手</p></div>
  <div class="nav">
    <div class="nav-item active" data-page="chat" onclick="switchTab('chat')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span>对话</span></div>
    <div class="nav-item" data-page="reports" onclick="switchTab('reports')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>报告</span></div>
    <div class="nav-item" data-page="tasks" onclick="switchTab('tasks')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>定时任务</span></div>
  </div>
</nav>
<main class="main">
  <div class="page active" id="page-chat">
    <div class="chat-messages" id="chatMessages">
      <div class="chat-msg bot">你好！我是学术论文自动追踪助手。你可以用自然语言告诉我你的需求，例如：<br><br><b>「追踪最近一个月 RAG 方向的高影响论文」</b><br><b>「帮我创建每周一早上追踪大语言模型推理优化的任务」</b><br><b>「显示我的任务列表」</b></div>
    </div>
    <div class="chat-input-wrap">
      <textarea id="chatInput" rows="1" placeholder="输入你的需求…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
      <button onclick="sendMessage()" id="sendBtn">发送</button>
    </div>
  </div>
  <div class="page" id="page-reports"><div class="page-header">历史报告</div><div class="reports-list" id="reportsList"></div></div>
  <div class="page" id="page-tasks"><div class="page-header">定时任务</div><div class="tasks-container" id="tasksContainer"></div></div>
</main>
<div class="modal-overlay" id="reportModal" onclick="if(event.target===this)closeModal()">
  <div class="modal"><div class="modal-header"><h2 id="modalTitle">报告详情</h2><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="modal-body" id="modalBody"></div></div>
</div>
<script>
var currentTab = 'chat';
var reportsCache = [];
var isProcessing = false;
var sessionId = Math.random().toString(36).substring(2, 10);

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.toggle('active', el.dataset.page === tab); });
  document.querySelectorAll('.page').forEach(function(el) { el.classList.toggle('active', el.id === 'page-' + tab); });
  if (tab === 'reports') loadReports();
  if (tab === 'tasks') loadTasks();
}

async function sendMessage() {
  if (isProcessing) return;
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text) return;
  isProcessing = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = ''; input.style.height = 'auto';
  appendMessage('user', text);
  var loadingEl = showLoading();
  try {
    var res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, session_id: sessionId }) });
    if (!res.ok) throw new Error('Server error');
    var data = await res.json();
    removeLoading(loadingEl);
    if (data.type === 'config_review' && data.config) { appendConfigReview(data.response, data.config, data.intent); }
    else { appendMessage('bot', data.response); }
  } catch (e) { removeLoading(loadingEl); appendMessage('bot', '抱歉，请求失败：' + e.message); }
  finally { isProcessing = false; document.getElementById('sendBtn').disabled = false; input.focus(); }
}

function appendMessage(role, text) {
  var container = document.getElementById('chatMessages');
  var div = document.createElement('div');
  div.className = 'chat-msg ' + role;
  if (role === 'bot') { div.innerHTML = marked.parse(text); } else { div.textContent = text; }
  container.appendChild(div); container.scrollTop = container.scrollHeight;
}

function showLoading() {
  var c = document.getElementById('chatMessages'), d = document.createElement('div');
  d.className = 'chat-loading'; d.id = 'loading-' + Date.now();
  d.innerHTML = '<span></span><span></span><span></span>';
  c.appendChild(d); c.scrollTop = c.scrollHeight; return d;
}

function removeLoading(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }

document.getElementById('chatInput').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });

function appendConfigReview(text, config, intent) {
  var container = document.getElementById('chatMessages');
  var div = document.createElement('div');
  div.className = 'chat-msg bot'; div.id = 'config-review-' + Date.now();
  div.innerHTML = marked.parse(text);
  var actions = document.createElement('div');
  actions.style.cssText = 'display:flex;gap:8px;margin-top:12px';
  actions.innerHTML = '<button class="cfg-btn cfg-btn-confirm" data-sid="' + sessionId + '">确认执行</button>' + '<button class="cfg-btn cfg-btn-edit" data-sid="' + sessionId + '">修改配置</button>' + '<button class="cfg-btn cfg-btn-cancel" data-sid="' + sessionId + '">取消</button>';
  div.appendChild(actions);
  div._configData = config; div._configIntent = intent;
  container.appendChild(div); container.scrollTop = container.scrollHeight;
}

document.getElementById('chatMessages').addEventListener('click', async function(e) {
  var btn = e.target.closest('.cfg-btn');
  if (!btn) return;
  var sid = btn.dataset.sid;
  var reviewDiv = btn.closest('.chat-msg.bot');
  if (!reviewDiv || !reviewDiv._configData) return;
  var config = reviewDiv._configData, intent = reviewDiv._configIntent;
  if (btn.classList.contains('cfg-btn-confirm')) {
    disableCfgButtons(reviewDiv);
    var res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: '__confirm__', session_id: sid }) });
    var data = await res.json(); appendMessage('bot', data.response);
    reviewDiv.querySelector('.cfg-btn-confirm').textContent = '已确认';
  } else if (btn.classList.contains('cfg-btn-edit')) {
    showConfigEditForm(reviewDiv, config, intent, sid);
  } else if (btn.classList.contains('cfg-btn-cancel')) {
    disableCfgButtons(reviewDiv);
    await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: '__cancel__', session_id: sid }) });
    appendMessage('bot', '已取消。');
    reviewDiv.querySelector('.cfg-btn-cancel').textContent = '已取消';
  }
});

function disableCfgButtons(div) {
  var btns = div.querySelectorAll('.cfg-btn');
  for (var i = 0; i < btns.length; i++) { btns[i].disabled = true; btns[i].style.opacity = '0.5'; btns[i].style.cursor = 'not-allowed'; }
}

function showConfigEditForm(reviewDiv, config, intent, sid) {
  while (reviewDiv.children.length > 0) {
    if (reviewDiv.lastChild.querySelector && reviewDiv.lastChild.querySelector('.cfg-btn')) break;
    reviewDiv.removeChild(reviewDiv.children[0]);
    if (reviewDiv.children.length === 0) break;
  }
  var form = document.createElement('div'); form.style.cssText = 'margin-top:8px';
  var fields = [
    { key: 'research_direction', label: '研究方向', type: 'text' },
    { key: 'keywords', label: '关键词', type: 'text', hint: '逗号分隔' },
    { key: 'sources', label: '数据源', type: 'text', hint: '逗号分隔' },
    { key: 'time_range_days', label: '时间范围(天)', type: 'number' },
    { key: 'categories', label: '排序类别', type: 'text', hint: 'latest/popular/relevant' },
    { key: 'top_n_per_category', label: '每类篇数', type: 'number' }
  ];
  if (intent === 'schedule') fields.push({ key: 'schedule', label: '定时规则', type: 'text', hint: 'weekly mon 08:00' });
  fields.push({ key: 'venues', label: '会议/期刊', type: 'text', hint: '逗号分隔' });
  for (var i = 0; i < fields.length; i++) {
    var f = fields[i], val = config[f.key];
    var display = Array.isArray(val) ? val.join(', ') : (val != null ? String(val) : '');
    var row = document.createElement('div'); row.className = 'cfg-edit-row';
    var hint = f.hint ? ' placeholder="' + f.hint + '"' : '';
    row.innerHTML = '<label>' + f.label + '</label><input class="cfg-field-edit" data-key="' + f.key + '" value="' + escHtml(display) + '"' + hint + '>';
    if (f.type === 'number') row.querySelector('input').type = 'number';
    form.appendChild(row);
  }
  reviewDiv.insertBefore(form, reviewDiv.firstChild);
  var editActions = document.createElement('div');
  editActions.style.cssText = 'display:flex;gap:8px;margin-top:10px';
  // editActions.innerHTML = '<button class="cfg-btn cfg-btn-confirm" style="font-size:12px">保存修改</button>' + '<button class="cfg-btn cfg-btn-cancel" style="font-size:12px">取消编辑</button>';
  editActions.innerHTML = '<button class="cfg-btn cfg-btn-confirm" style="font-size:12px">保存修改</button>';
  reviewDiv.insertBefore(editActions, reviewDiv.children[reviewDiv.children.length - 1]);
  var confirmBtn = reviewDiv.querySelector('.cfg-btn-confirm');
  // var cancelBtn = reviewDiv.querySelector('.cfg-btn-cancel');
  confirmBtn.onclick = async function() {
    var updated = JSON.parse(JSON.stringify(config));
    var inputs = reviewDiv.querySelectorAll('.cfg-field-edit');
    for (var j = 0; j < inputs.length; j++) {
      var inp = inputs[j], k = inp.dataset.key;
      if (k === 'keywords' || k === 'sources' || k === 'categories' || k === 'venues') {
        updated[k] = inp.value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
        if (updated[k].length === 0) updated[k] = config[k];
      } else if (k === 'time_range_days' || k === 'top_n_per_category') {
        updated[k] = parseInt(inp.value) || config[k];
      } else { updated[k] = inp.value || config[k]; }
    }
    var res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: '__update_config__' + JSON.stringify(updated), session_id: sid }) });
    var data = await res.json(); reviewDiv.remove();
    if (data.type === 'config_review' && data.config) { appendConfigReview(data.response, data.config, data.intent); }
    else { appendMessage('bot', data.response); }
  };
  // cancelBtn.onclick = function() { reviewDiv.remove(); appendConfigReview('编辑已取消。以下是原始配置：', config, intent); };
}

async function loadReports() {
  var container = document.getElementById('reportsList');
  try {
    var res = await fetch('/api/reports?limit=50'); reportsCache = await res.json();
    if (!reportsCache.length) { container.innerHTML = '<div class="report-empty">暂无历史报告</div>'; return; }
    container.innerHTML = reportsCache.map(function(r) {
      return '<div class="report-card" data-report-id="' + r.id + '"><h3>#' + r.id + ' ' + escHtml(r.research_direction) + '</h3><div class="meta">' + r.created_at + '</div><div class="preview">' + escHtml(r.preview) + '</div><div class="card-actions"><button class="btn-del-report" data-report-id="' + r.id + '" data-report-name="' + escHtml(r.research_direction) + '">删除</button></div></div>';
    }).join('');
  } catch (e) { container.innerHTML = '<div class="report-empty">加载失败：' + e.message + '</div>'; }
}

document.getElementById('reportsList').addEventListener('click', function(e) {
  var card = e.target.closest('.report-card'); if (!card) return;
  if (e.target.closest('.btn-del-report')) return;
  var id = parseInt(card.dataset.reportId); if (id) openReport(id);
});
document.getElementById('reportsList').addEventListener('click', function(e) {
  var btn = e.target.closest('.btn-del-report'); if (!btn) return;
  e.stopPropagation();
  deleteReport(parseInt(btn.dataset.reportId), btn.dataset.reportName);
});

async function openReport(id) {
  document.getElementById('modalBody').innerHTML = '<p style="text-align:center;padding:40px">加载中…</p>';
  document.getElementById('reportModal').classList.add('open');
  try {
    var res = await fetch('/api/reports/' + id); if (!res.ok) throw new Error('Not found');
    var data = await res.json();
    document.getElementById('modalTitle').textContent = data.research_direction;
    document.getElementById('modalBody').innerHTML = marked.parse(data.markdown);
  } catch (e) { document.getElementById('modalBody').innerHTML = '<p>加载失败：' + e.message + '</p>'; }
}

async function deleteReport(id, name) {
  if (!confirm('确定要删除报告 #' + id + '（' + name + '）吗？此操作不可撤销。')) return;
  try { var res = await fetch('/api/reports/' + id, { method: 'DELETE' }); if (!res.ok) throw new Error('Delete failed'); loadReports(); }
  catch (e) { alert('删除失败：' + e.message); }
}

function closeModal() { document.getElementById('reportModal').classList.remove('open'); }

async function loadTasks() {
  var container = document.getElementById('tasksContainer');
  try {
    var res = await fetch('/api/tasks'); var tasks = await res.json();
    if (!tasks.length) { container.innerHTML = '<div class="task-empty">暂无定时任务</div>'; return; }
    container.innerHTML = '<table><thead><tr><th>ID</th><th>研究方向</th><th>定时规则</th><th>创建时间</th><th>操作</th></tr></thead><tbody>' + tasks.map(function(t) {
      return '<tr><td>#' + t.id + '</td><td>' + escHtml(t.research_direction) + '</td><td><span class="task-schedule">' + escHtml(t.schedule) + '</span></td><td>' + t.created_at + '</td><td><button class="btn-del-task" data-task-id="' + t.id + '" data-task-name="' + escHtml(t.research_direction) + '">删除</button></td></tr>';
    }).join('') + '</tbody></table>';
  } catch (e) { container.innerHTML = '<div class="task-empty">加载失败：' + e.message + '</div>'; }
}

document.getElementById('tasksContainer').addEventListener('click', function(e) {
  var btn = e.target.closest('.btn-del-task'); if (!btn) return;
  deleteTask(parseInt(btn.dataset.taskId), btn.dataset.taskName);
});

async function deleteTask(id, name) {
  if (!confirm('确定要删除任务 #' + id + '（' + name + '）吗？此操作不可撤销。')) return;
  try { var res = await fetch('/api/tasks/' + id, { method: 'DELETE' }); if (!res.ok) throw new Error('Delete failed'); loadTasks(); }
  catch (e) { alert('删除失败：' + e.message); }
}

function escHtml(s) { var div = document.createElement('div'); div.textContent = s; return div.innerHTML; }
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
